<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Search Engine</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
            color: #202124;
        }

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            margin-top: 130px;
            font-size: 58px;
            font-weight: bold;
            letter-spacing: -3px;
        }

        .logo span {
            color: #4285f4;
        }

        .subtitle {
            margin-top: 10px;
            color: #777;
            font-size: 16px;
        }

        .search-box {
            margin-top: 35px;
            width: 90%;
            max-width: 650px;
            height: 54px;
            border: 1px solid #dfe1e5;
            border-radius: 28px;
            display: flex;
            align-items: center;
            padding: 0 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 18px;
            padding: 10px;
        }

        .search-icon {
            font-size: 22px;
        }

        .search-button {
            margin-top: 25px;
            padding: 12px 28px;
            border: none;
            border-radius: 6px;
            background: #f8f9fa;
            font-size: 15px;
            cursor: pointer;
        }

        .search-button:hover {
            box-shadow: 0 1px 5px rgba(0,0,0,0.2);
        }

        #results {
            width: 90%;
            max-width: 700px;
            margin-top: 35px;
        }

        .result {
            margin-bottom: 28px;
        }

        .result-title {
            font-size: 20px;
            color: #1a0dab;
            text-decoration: none;
        }

        .result-url {
            margin-top: 5px;
            color: #188038;
            font-size: 14px;
        }

        .result-description {
            margin-top: 7px;
            color: #555;
            line-height: 1.5;
        }

        .loading {
            color: #777;
        }

        .error {
            color: #d93025;
        }

        .footer {
            margin-top: auto;
            padding: 25px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        <span>UBIIISA</span> Search
    </div>

    <div class="subtitle">
        შენი საკუთარი საძიებო სისტემა
    </div>

    <form class="search-box" onsubmit="search(event)">

        <div class="search-icon">🔍</div>

        <input
            id="searchInput"
            type="text"
            placeholder="მოძებნე..."
            autocomplete="off"
        >

    </form>

    <button class="search-button" onclick="searchButton()">
        ძებნა
    </button>

    <div id="results"></div>

    <div class="footer">
        © 2026 My Search Engine
    </div>

</div>

<script>

const API_URL =
    "https://my-search-engine-api.onrender.com/search";

function search(event) {

    event.preventDefault();

    performSearch();

}

function searchButton() {

    performSearch();

}

async function performSearch() {

    const input =
        document.getElementById("searchInput");

    const results =
        document.getElementById("results");

    const query =
        input.value.trim();

    if (!query) {
        return;
    }

    results.innerHTML =
        '<div class="loading">ვეძებ...</div>';

    try {

        const response = await fetch(
            API_URL + "?q=" + encodeURIComponent(query)
        );

        if (!response.ok) {
            throw new Error("Search API error");
        }

        const data = await response.json();

        if (data.results.length === 0) {

            results.innerHTML =
                "<p>შედეგი ვერ მოიძებნა.</p>";

            return;
        }

        results.innerHTML =
            data.results.map(result => {

                return `
                    <div class="result">

                        <a
                            class="result-title"
                            href="${result.url}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            ${result.title}
                        </a>

                        <div class="result-url">
                            ${result.url}
                        </div>

                        <div class="result-description">
                            ${result.description}
                        </div>

                    </div>
                `;

            }).join("");

    } catch (error) {

        console.error(error);

        results.innerHTML =
            '<div class="error">საძიებო სერვერთან დაკავშირება ვერ მოხერხდა.</div>';

    }

}

</script>

</body>
</html>
